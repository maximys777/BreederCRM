databaseChangeLog:
  - changeSet:
      id: create-favorite-table
      author: maximys777
      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: dog_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_favorites_user

        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: dog_id
            referencedTableName: dogs
            referencedColumnNames: id
            constraintName: fk_favorites_dog
