databaseChangeLog:
  - changeSet:
      id: create-dogs-table
      author: maximys777
      changes:
        - createTable:
            tableName: dogs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(30)
              - column:
                  name: breed
                  type: VARCHAR(10)
              - column:
                  name: birth_date
                  type: TIMESTAMP
              - column:
                  name: gender
                  type: VARCHAR(10)
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: price
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP