databaseChangeLog:
  - changeSet:
      id: create-feedback-table
      author: maximys777
      changes:
        - createTable:
            tableName: feedbacks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: contact_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: contact_value
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: feedback_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: dog_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: feedbacks
            baseColumnNames: dog_id
            referencedTableName: dogs
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_feedbacks_dog

